# HAProxy baseline.
# NB: HAProxy is a proxy, not a static file server. To keep the comparison
# about protocol/serving cost only, HAProxy synthesises the same 3-byte body
# ("ok\n") that syzygy and nginx read from disk. The extra file I/O that
# syzygy pays is therefore counted AGAINST syzygy, not for it.
global
    nbthread 2
    maxconn 100000
    # no log targets: logging is off for every server in this benchmark

defaults
    mode http
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout http-keep-alive 75s
    option http-buffer-request

frontend fe_plain
    bind 127.0.0.1:19082
    http-request return status 200 content-type text/plain lf-string "ok\n"

frontend fe_tls
    bind 127.0.0.1:19445 ssl crt /tmp/syzygy-bench/haproxy.pem alpn h2,http/1.1
    http-request return status 200 content-type text/plain lf-string "ok\n"
