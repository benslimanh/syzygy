# nginx baseline - tuned for loopback benchmarking, same worker count as syzygy
worker_processes 2;
worker_rlimit_nofile 65536;
error_log /tmp/syzygy-bench/nginx-error.log warn;
pid /tmp/syzygy-bench/nginx.pid;
daemon off;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    client_body_temp_path /tmp/syzygy-bench/cbt;
    proxy_temp_path /tmp/syzygy-bench/pt;
    fastcgi_temp_path /tmp/syzygy-bench/ft;
    uwsgi_temp_path /tmp/syzygy-bench/ut;
    scgi_temp_path /tmp/syzygy-bench/st;
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    keepalive_requests 1000000;
    default_type text/plain;
    types { }
    include /etc/nginx/mime.types;

    server {
        listen 127.0.0.1:19081;
        listen 127.0.0.1:19444 ssl;
        http2 on;

        ssl_certificate     /home/user/syzygy/certs/cert.pem;
        ssl_certificate_key /home/user/syzygy/certs/key.pem;
        ssl_protocols TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        root /home/user/syzygy/tests/compat/fixtures;
    }
}
