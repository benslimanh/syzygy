name: deploy

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Signed release digest (sha256:...) from image-reference.txt'
        required: true
        type: string
      release_tag:
        description: 'Exact signing tag, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub-hosted runners cannot reach a WSL-local cluster by default.
    # Opt in only when a staging cluster is reachable; no secrets on PRs.
    if: github.ref == 'refs/heads/main' && vars.DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install verified deployment tooling
        run: python3 scripts/ci/tools.py helm cosign kubectl
      - name: Validate inputs and deploy with automatic rollback
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          : "${KUBECONFIG_B64:?Configure the protected staging secret}"
          KUBECONFIG=$(mktemp)
          export KUBECONFIG
          chmod 600 "$KUBECONFIG"
          trap 'rm -f "$KUBECONFIG"' EXIT
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$KUBECONFIG"
          export COSIGN_CERTIFICATE_IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG"
          bash scripts/ops/deploy.sh "ghcr.io/${GITHUB_REPOSITORY,,}@$IMAGE_DIGEST"
