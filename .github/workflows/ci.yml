name: ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-test:
    name: Build & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev libnghttp2-dev \
               libssl-dev devscripts cppcheck nghttp2-client curl

      - name: Build mbedTLS
        run: make -C mbedtls CFLAGS="-O2 -fPIC" lib

      - name: Build
        run: make -j$(nproc)

      - name: Unit tests
        run: make test

      - name: Hardening check
        run: make hardening-check

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: syzygy
          path: |
            syzygy

  repro:
    name: Reproducibility gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Install deps
        run: |
          sudo apt-get update 
          sudo apt-get install -y build-essential zlib1g-dev libnghttp2-dev libssl-dev

      - name: Build mbedTLS
        run: make -C mbedtls CFLAGS="-O2 -fPIC" lib

      - name: repro
        run: make repro

  module-build:
    name: Build sample module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive 
          
      - name: Install deps
        run: |
          sudo apt-get update 
          sudo apt-get install -y build-essential libnghttp2-dev libmodsecurity-dev
          
      - name: Build mbedTLS
        run: make -C mbedtls CFLAGS="-O2 -fPIC" lib

      - name: Build Modules
        run: make mod